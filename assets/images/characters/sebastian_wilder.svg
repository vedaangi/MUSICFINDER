<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSeb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#213722"/>
      <stop offset="60%" stop-color="#1A1626"/>
      <stop offset="100%" stop-color="#2C263F"/>
    </linearGradient>
    <radialGradient id="auraSeb" cx="50%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#2D4A2F" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#100E17" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="750" fill="url(#bgSeb)"/>
  <circle cx="300" cy="300" r="200" fill="url(#auraSeb)"/>

  <rect x="24" y="24" width="552" height="702" rx="16" fill="none" stroke="#A3C9A7" stroke-opacity="0.25" stroke-width="2"/>
  <rect x="34" y="34" width="532" height="682" rx="12" fill="none" stroke="#C0B6DE" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- Character Artwork: Sebastian Wilder -->
  <g transform="translate(300, 290)">
    <circle r="140" fill="#201B2E" stroke="#A3C9A7" stroke-opacity="0.35" stroke-width="2"/>
    
    <!-- Vintage 1940s Haircut (Classic Side Part) -->
    <path d="M-35,-80 C-20,-95 25,-95 40,-75 C45,-55 35,-30 35,0 C25,-15 15,-20 0,-20 C-20,-20 -30,-5 -35,0 C-40,-35 -40,-65 -35,-80 Z" fill="#2C263F" stroke="#C0B6DE" stroke-width="2"/>

    <!-- Head & Classical Profile -->
    <circle cx="0" cy="-35" r="36" fill="#F5F3FA" stroke="#A3C9A7" stroke-width="1.5"/>

    <!-- Classic Jazz Shirt Collar & Slim Tie -->
    <path d="M-65,110 C-65,55 -30,40 0,40 C30,40 65,55 65,110 Z" fill="#2D4A2F" stroke="#A3C9A7" stroke-width="2"/>
    
    <!-- Crisp White Dress Shirt V-Neck & Slim Tie -->
    <polygon points="-16,40 0,65 16,40" fill="#EFF6F0"/>
    <polygon points="-5,50 5,50 3,95 -3,95" fill="#2C263F" stroke="#C0B6DE" stroke-width="1"/>

    <!-- Piano Keys (Jazz Motif) -->
    <g transform="translate(-50, 85)">
      <rect x="0" y="0" width="100" height="25" rx="3" fill="#EFF6F0" stroke="#171420" stroke-width="1"/>
      <line x1="14" y1="0" x2="14" y2="25" stroke="#171420" stroke-width="1"/>
      <line x1="28" y1="0" x2="28" y2="25" stroke="#171420" stroke-width="1"/>
      <line x1="42" y1="0" x2="42" y2="25" stroke="#171420" stroke-width="1"/>
      <line x1="56" y1="0" x2="56" y2="25" stroke="#171420" stroke-width="1"/>
      <line x1="70" y1="0" x2="70" y2="25" stroke="#171420" stroke-width="1"/>
      <line x1="84" y1="0" x2="84" y2="25" stroke="#171420" stroke-width="1"/>
      
      <!-- Black Keys -->
      <rect x="8" y="0" width="8" height="15" fill="#2C263F"/>
      <rect x="22" y="0" width="8" height="15" fill="#2C263F"/>
      <rect x="50" y="0" width="8" height="15" fill="#2C263F"/>
      <rect x="64" y="0" width="8" height="15" fill="#2C263F"/>
      <rect x="78" y="0" width="8" height="15" fill="#2C263F"/>
    </g>
  </g>

  <!-- Typography Card Footer -->
  <text x="300" y="525" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="32" font-weight="700" fill="#F5F3FA" letter-spacing="1">
    Sebastian Wilder
  </text>
  
  <text x="300" y="560" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" fill="#A3C9A7" letter-spacing="2">
    LA LA LAND (2016)
  </text>

  <rect x="180" y="600" width="240" height="34" rx="17" fill="#213722" stroke="#A3C9A7" stroke-opacity="0.4" stroke-width="1"/>
  <text x="300" y="622" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#EFF6F0" letter-spacing="1">
    JAZZ SOUNDTRACK MUSE
  </text>
</svg>