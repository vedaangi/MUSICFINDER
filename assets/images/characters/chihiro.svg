<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgChihiro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2C263F"/>
      <stop offset="60%" stop-color="#1A1626"/>
      <stop offset="100%" stop-color="#213722"/>
    </linearGradient>
    <radialGradient id="auraChihiro" cx="50%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#2D4A2F" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#100E17" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="750" fill="url(#bgChihiro)"/>
  <circle cx="300" cy="300" r="200" fill="url(#auraChihiro)"/>

  <rect x="24" y="24" width="552" height="702" rx="16" fill="none" stroke="#C0B6DE" stroke-opacity="0.25" stroke-width="2"/>
  <rect x="34" y="34" width="532" height="682" rx="12" fill="none" stroke="#A3C9A7" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- Character Artwork: Chihiro -->
  <g transform="translate(300, 290)">
    <circle r="140" fill="#201B2E" stroke="#C0B6DE" stroke-opacity="0.35" stroke-width="2"/>
    
    <!-- Signature High Ponytail & Bangs (Studio Ghibli Style) -->
    <path d="M-35,-45 C-35,-85 -10,-95 0,-95 C10,-95 35,-85 35,-45 C30,-30 25,-10 0,-10 C-25,-10 -30,-30 -35,-45 Z" fill="#2C263F" stroke="#C0B6DE" stroke-width="2"/>
    <!-- High Ponytail Sprouting to Side -->
    <path d="M15,-85 C35,-105 70,-105 80,-85 C90,-65 75,-45 60,-40 C45,-35 25,-65 15,-85 Z" fill="#2C263F" stroke="#C0B6DE" stroke-width="2"/>
    <circle cx="20" cy="-80" r="5" fill="#A3C9A7"/> <!-- Hair tie -->

    <!-- Head & Round Eyes Silhouette -->
    <circle cx="0" cy="-35" r="34" fill="#F5F3FA" stroke="#C0B6DE" stroke-width="1.5"/>

    <!-- Green & White Striped T-Shirt -->
    <path d="M-60,110 C-60,50 -30,40 0,40 C30,40 60,50 60,110 Z" fill="#2D4A2F" stroke="#A3C9A7" stroke-width="2"/>
    
    <!-- Horizontal White T-Shirt Stripes -->
    <path d="M-40,65 Q0,75 40,65" fill="none" stroke="#EFF6F0" stroke-width="4"/>
    <path d="M-48,85 Q0,95 48,85" fill="none" stroke="#EFF6F0" stroke-width="4"/>
    <path d="M-55,105 Q0,115 55,105" fill="none" stroke="#EFF6F0" stroke-width="4"/>

    <!-- Soot Sprite (Susuwatari) Companion -->
    <g transform="translate(70, 45)">
      <circle r="14" fill="#100E17" stroke="#A3C9A7" stroke-width="1.5"/>
      <circle cx="-4" cy="-2" r="3" fill="#EFF6F0"/>
      <circle cx="4" cy="-2" r="3" fill="#EFF6F0"/>
      <circle cx="-3" cy="-2" r="1.5" fill="#100E17"/>
      <circle cx="5" cy="-2" r="1.5" fill="#100E17"/>
    </g>
  </g>

  <!-- Typography Card Footer -->
  <text x="300" y="525" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="32" font-weight="700" fill="#F5F3FA" letter-spacing="1">
    Chihiro (Sen)
  </text>
  
  <text x="300" y="560" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" fill="#A3C9A7" letter-spacing="2">
    SPIRITED AWAY (STUDIO GHIBLI, 2001)
  </text>

  <rect x="180" y="600" width="240" height="34" rx="17" fill="#213722" stroke="#A3C9A7" stroke-opacity="0.4" stroke-width="1"/>
  <text x="300" y="622" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#EFF6F0" letter-spacing="1">
    LO-FI / AMBIENT SOUNDTRACK MUSE
  </text>
</svg>